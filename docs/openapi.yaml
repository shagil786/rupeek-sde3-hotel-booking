openapi: 3.0.3
info:
  title: Rupeek Hotel Booking API
  version: 1.0.0
  description: Versioned take-home contract for hotel discovery and booking.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
paths:
  /api/v1/owners:
    post:
      summary: Create an owner
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateOwner'}}}
      responses: {'201': {description: Created}, '400': {description: Invalid input}}
  /api/v1/owners/{ownerId}/properties:
    post:
      summary: Add a property to an owner
      parameters: [{in: path, name: ownerId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateProperty'}}}
      responses: {'201': {description: Created}, '403': {description: Not owner}}
  /api/v1/properties/{propertyId}/room-types:
    post:
      summary: Add room inventory
      parameters: [{in: path, name: propertyId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateRoomType'}}}
      responses: {'201': {description: Created}, '409': {description: Conflict}}
  /api/v1/properties:
    get:
      summary: Discover available properties
      parameters:
        - {in: query, name: city, schema: {type: string}}
        - {in: query, name: locality, schema: {type: string}}
        - {in: query, name: checkIn, schema: {type: string, format: date}}
        - {in: query, name: checkOut, schema: {type: string, format: date}}
        - {in: query, name: guests, schema: {type: integer, minimum: 1}}
        - {in: query, name: minPrice, schema: {type: number}}
        - {in: query, name: maxPrice, schema: {type: number}}
        - {in: query, name: stars, schema: {type: integer}}
        - {in: query, name: amenities, schema: {type: string, description: Comma-separated amenities}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Available properties}, '400': {description: Invalid filters}}
  /api/v1/bookings:
    post:
      summary: Place a payment hold
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBooking'}}}
      responses: {'201': {description: Pending booking}, '409': {description: Inventory conflict}}
  /api/v1/bookings/{bookingId}:
    get:
      summary: Get a booking
      parameters: [{in: path, name: bookingId, required: true, schema: {type: string}}]
      responses: {'200': {description: Booking}, '403': {description: Not booking owner}, '404': {description: Not found}}
  /api/v1/bookings/{bookingId}/payments:
    post:
      summary: Pay for a booking
      parameters:
        - {in: path, name: bookingId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [method], properties: {method: {type: string}}}}}
      responses: {'200': {description: Payment outcome}, '409': {description: Invalid state}}
  /api/v1/bookings/{bookingId}/cancellations:
    post:
      summary: Cancel a booking
      parameters:
        - {in: path, name: bookingId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses: {'204': {description: Cancelled}, '409': {description: Invalid state}}
components:
  securitySchemes: {basicAuth: {type: http, scheme: basic}}
  schemas:
    CreateOwner: {type: object, required: [username], properties: {username: {type: string}}}
    CreateProperty: {type: object, required: [name, city, locality, starRating], properties: {name: {type: string}, city: {type: string}, locality: {type: string}, starRating: {type: integer}, amenities: {type: array, items: {type: string}}}}
    CreateRoomType: {type: object, required: [name, capacity, pricePerNight, inventoryCount], properties: {name: {type: string}, capacity: {type: integer}, pricePerNight: {type: number}, inventoryCount: {type: integer}}}
    CreateBooking: {type: object, required: [roomTypeId, checkIn, checkOut, guests], properties: {roomTypeId: {type: string}, checkIn: {type: string, format: date}, checkOut: {type: string, format: date}, guests: {type: integer}}}
